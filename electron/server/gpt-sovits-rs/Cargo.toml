[package]
name = "gpt-sovits-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gpt-sovits-server"
path = "src/main.rs"

[dependencies]
# Core GPT-SoVITS Rust implementation
gpt_sovits_rs = { version = "0.7", features = ["enable_jp"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Audio processing
wav_io = "0.1.14"
hound = "3.5"

# Base64 encoding
base64 = "0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
